
name: Demo CI Env Secrets


on:
  push:
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Say Hello
              run: echo "Hello from demo workflow !"

            - name: Install
              env:
                APP_ENV: demo
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: echo "Environment $APP_ENV and using secret $DB_PASSWORD"